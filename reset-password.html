<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ | ST8 CP-Grader</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #030712; color: #f3f4f6; }
    .tech-glass {
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="tech-glass rounded-3xl p-8 max-w-md w-full space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-lg mx-auto border border-cyan-500/30">
        <i class="fa-solid fa-key"></i>
      </div>
      <h3 class="text-xl font-bold text-white">ตั้งรหัสผ่านใหม่</h3>
      <p class="text-xs text-gray-400">กรุณากรอกรหัสผ่านใหม่ที่คุณต้องการใช้งาน</p>
    </div>

    <form id="updatePasswordForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-cyan-300 mb-1">รหัสผ่านใหม่ (New Password)</label>
        <input type="password" id="newPassword" placeholder="••••••••" required class="w-full bg-black/60 border border-cyan-500/20 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400 font-mono">
      </div>

      <div>
        <label class="block text-xs font-medium text-cyan-300 mb-1">ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmNewPassword" placeholder="••••••••" required class="w-full bg-black/60 border border-cyan-500/20 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400 font-mono">
      </div>

      <div id="statusMessage" class="text-xs text-center hidden"></div>

      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20 cursor-pointer hover:opacity-95">
        บันทึกรหัสผ่านใหม่
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://hqnmfkafwwnjiqpdhzoh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxbm1ma2Fmd3duamlxcGRoem9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMTc0NzEsImV4cCI6MjEwOTc5MzQ3MX0.m6dHtNnXuQ108DvafyKWeFvAg_oySuQH3LRg0Jzaops';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmNewPassword').value;
      const msg = document.getElementById('statusMessage');

      msg.classList.remove('hidden');

      if (newPassword !== confirmPass) {
        msg.textContent = '❌ รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง';
        msg.className = 'text-xs text-center text-rose-400 font-semibold';
        return;
      }

      if (newPassword.length < 6) {
        msg.textContent = '❌ รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษรขึ้นไป';
        msg.className = 'text-xs text-center text-rose-400 font-semibold';
        return;
      }

      msg.textContent = 'กำลังอัปเดตรหัสผ่าน...';
      msg.className = 'text-xs text-center text-cyan-300 font-semibold';

      // ใช้ฟังก์ชันอัปเดตข้อมูลผู้ใช้ของ Supabase
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        msg.textContent = `❌ เกิดข้อผิดพลาด: ${error.message}`;
        msg.className = 'text-xs text-center text-rose-400 font-semibold';
      } else {
        msg.textContent = '✅ เปลี่ยนรหัสผ่านสำเร็จ! กำลังพากลับสู่หน้าหลัก...';
        msg.className = 'text-xs text-center text-emerald-400 font-semibold';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      }
    });
  </script>
</body>
</html>
