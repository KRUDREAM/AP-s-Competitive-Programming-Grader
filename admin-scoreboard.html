<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard กระดานคะแนน | ST8 CP-Grader Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #030712; color: #f3f4f6; }
    .tech-glass { background: rgba(10, 15, 30, 0.78); backdrop-filter: blur(20px); border: 1px solid rgba(56, 189, 248, 0.16); }
    .cyber-grid { background-image: linear-gradient(to right, rgba(56, 189, 248, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.03) 1px, transparent 1px); background-size: 32px 32px; }
  </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden cyber-grid">
  <div id="systemToast" class="fixed top-5 right-5 z-[80] transform translate-x-[120%] transition-all duration-300 tech-glass px-5 py-3.5 rounded-2xl border border-cyan-500/40 shadow-2xl flex items-center gap-3">
    <i id="toastIcon" class="fa-solid fa-circle-check text-cyan-400 text-lg"></i>
    <div><h4 id="toastTitle" class="text-xs font-bold text-white"></h4><p id="toastDesc" class="text-xs text-gray-300"></p></div>
  </div>

  <div id="adminHeaderMount"></div>

  <div class="flex-1 flex flex-col lg:flex-row relative z-10 w-full min-w-0">
    <div id="adminSidebarMount"></div>

    <main class="flex-1 min-w-0 px-4 md:px-6 py-6 space-y-5">
      <div class="flex flex-wrap gap-3 justify-between items-center bg-gradient-to-r from-cyan-950/40 to-emerald-950/20 p-5 rounded-2xl border border-cyan-500/20">
        <div>
          <h2 class="text-lg md:text-xl font-bold text-white"><i class="fa-solid fa-ranking-star text-yellow-400 mr-2"></i> Scoreboard กระดานคะแนนรวม</h2>
          <p class="text-xs text-gray-400">จัดอันดับคะแนนรวมจากโจทย์ที่ผ่าน (Accepted) ของผู้เข้าแข่งขันทุกคนในระบบ</p>
        </div>
        <button type="button" onclick="exportScoreboardCsv()" class="tech-glass hover:bg-emerald-500/15 text-emerald-300 border border-emerald-500/35 px-4 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-file-csv"></i> Export CSV
        </button>
      </div>

      <!-- Filter Bar -->
      <div class="tech-glass p-4 rounded-2xl border border-cyan-500/20 flex flex-wrap gap-3 items-center justify-between">
        <div class="relative flex-1 min-w-[220px]">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-cyan-400 text-xs"></i>
          <input type="text" id="sbSearchInput" oninput="renderScoreboardTable()" placeholder="ค้นหาชื่อผู้ใช้ หรือ User ID..." class="w-full bg-black/60 border border-cyan-500/25 focus:border-cyan-400 focus:outline-none rounded-xl pl-9 pr-4 py-2 text-sm text-white">
        </div>
        <div class="text-xs text-gray-400">ผู้เข้าแข่งขันทั้งหมด: <span id="sbTotalUsers" class="text-cyan-300 font-bold">0</span> คน</div>
      </div>

      <!-- Scoreboard Table -->
      <div class="tech-glass rounded-2xl overflow-x-auto border border-cyan-500/20">
        <table class="w-full text-left text-sm">
          <thead class="bg-cyan-950/50 text-cyan-300 border-b border-cyan-500/20 text-xs uppercase">
            <tr>
              <th class="px-4 py-3.5 text-center w-20">อันดับ</th>
              <th class="px-4 py-3.5">ผู้เข้าแข่งขัน</th>
              <th class="px-4 py-3.5 text-center">ผ่านแล้ว (AC)</th>
              <th class="px-4 py-3.5 text-center">ส่งทั้งหมด</th>
              <th class="px-4 py-3.5 text-center">คะแนนรวม</th>
              <th class="px-4 py-3.5 text-right">อัปเดตล่าสุด</th>
            </tr>
          </thead>
          <tbody id="scoreboardTableBody" class="divide-y divide-cyan-500/10">
            <tr><td colspan="6" class="p-6 text-center text-gray-400">กำลังประมวลผลคะแนน...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="admin-common.js"></script>
  <script>
    renderAdminShell('scoreboard');
    let rankedUsersData = [];

    async function loadScoreboardData() {
      const [{ data: probs }, { data: subs }, { data: profiles }] = await Promise.all([
        supabaseClient.from('problems').select('id, max_score'),
        supabaseClient.from('submissions').select('user_id, problem_id, status, score, created_at'),
        supabaseClient.from('profiles').select('id, username, full_name, email')
      ]);

      const scoreMap = {};
      (probs || []).forEach(p => { scoreMap[p.id] = p.max_score || 100; });

      const profileMap = {};
      (profiles || []).forEach(u => { profileMap[u.id] = u; });

      const userStats = {};
      (subs || []).forEach(s => {
        const uid = s.user_id || 'anonymous';
        if (!userStats[uid]) {
          const prof = profileMap[uid] || {};
          userStats[uid] = {
            userId: uid,
            displayName: prof.username || prof.full_name || prof.email || `User-${String(uid).slice(0, 6)}`,
            solvedMap: {},
            totalSubmissions: 0,
            lastActive: s.created_at
          };
        }
        userStats[uid].totalSubmissions++;
        if (s.created_at && (!userStats[uid].lastActive || new Date(s.created_at) > new Date(userStats[uid].lastActive))) {
          userStats[uid].lastActive = s.created_at;
        }
        if (s.status === 'Accepted' || s.status === 'AC') {
          const pts = s.score != null ? Number(s.score) : (scoreMap[s.problem_id] || 100);
          userStats[uid].solvedMap[s.problem_id] = Math.max(userStats[uid].solvedMap[s.problem_id] || 0, pts);
        }
      });

      rankedUsersData = Object.values(userStats).map(u => {
        const solvedCount = Object.keys(u.solvedMap).length;
        const totalScore = Object.values(u.solvedMap).reduce((sum, v) => sum + v, 0);
        return { ...u, solvedCount, totalScore };
      }).sort((a, b) => b.totalScore - a.totalScore || b.solvedCount - a.solvedCount);

      renderScoreboardTable();
    }

    function renderScoreboardTable() {
      const tbody = document.getElementById('scoreboardTableBody');
      const query = (document.getElementById('sbSearchInput').value || '').trim().toLowerCase();
      const filtered = rankedUsersData.filter(u => !query || u.displayName.toLowerCase().includes(query) || String(u.userId).toLowerCase().includes(query));

      document.getElementById('sbTotalUsers').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400">ไม่พบข้อมูลผู้เข้าแข่งขัน</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((u, idx) => {
        const rank = idx + 1;
        let rankBadge = `<span class="font-bold text-gray-300">#${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="px-2.5 py-1 rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/40 font-bold text-xs"><i class="fa-solid fa-crown mr-1"></i>1</span>`;
        else if (rank === 2) rankBadge = `<span class="px-2.5 py-1 rounded-full bg-slate-400/20 text-slate-200 border border-slate-400/40 font-bold text-xs">2</span>`;
        else if (rank === 3) rankBadge = `<span class="px-2.5 py-1 rounded-full bg-amber-700/25 text-amber-300 border border-amber-600/40 font-bold text-xs">3</span>`;

        const timeStr = u.lastActive ? new Date(u.lastActive).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '-';

        return `
          <tr class="hover:bg-cyan-500/5 transition">
            <td class="px-4 py-3.5 text-center">${rankBadge}</td>
            <td class="px-4 py-3.5">
              <div class="font-semibold text-white">${u.displayName}</div>
              <div class="text-[11px] text-gray-400">ID: ${String(u.userId).slice(0, 12)}</div>
            </td>
            <td class="px-4 py-3.5 text-center"><span class="text-emerald-400 font-bold">${u.solvedCount}</span> ข้อ</td>
            <td class="px-4 py-3.5 text-center text-gray-300">${u.totalSubmissions} ครั้ง</td>
            <td class="px-4 py-3.5 text-center"><span class="text-cyan-300 font-bold text-base">${u.totalScore}</span></td>
            <td class="px-4 py-3.5 text-right text-xs text-gray-400">${timeStr}</td>
          </tr>
        `;
      }).join('');
    }

    function exportScoreboardCsv() {
      if (!rankedUsersData.length) return;
      const rows = [['Rank', 'Name', 'Solved_AC', 'Total_Submissions', 'Total_Score']];
      rankedUsersData.forEach((u, i) => rows.push([i + 1, `"${u.displayName}"`, u.solvedCount, u.totalSubmissions, u.totalScore]));
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `st8_scoreboard_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Export สำเร็จ', 'ดาวน์โหลดไฟล์ CSV กระดานคะแนนแล้ว');
    }

    ensureAdminSession(loadScoreboardData);
  </script>
</body>
</html>
